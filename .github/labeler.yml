# 测试相关改动
testing:
  - changed-files:
      - any-glob-to-any-file: 'tests/**/*'

# 核心代码与入口文件
core-code:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - 'main.py'

# 嵌入式前端 UI 界面
web-ui:
  - changed-files:
      - any-glob-to-any-file: 'web/**/*'

# 文档与静态资源
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'assets/**/*'
          - '**/*.md'

# CI/CD 与工具链配置
ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - '.flake8'
          - 'pytest.ini'
          - '.dockerignore'
          - '.gitignore'
          - 'docker-compose.yml'
          - 'Dockerfile'
          - '.env.example'
          - 'pyproject.toml'

# AI 辅助规则与 Prompt 配置
ai-config:
  - changed-files:
      - any-glob-to-any-file:
          - '.claude/**/*'
          - '.qoder/**/*'
