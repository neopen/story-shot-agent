name: Docker Build & Push  # 工作流名称：Docker 镜像构建与发布

on:
  push:
    branches: [ "main" ]       # 推送到 main 分支时触发
    tags: [ 'v*.*.*' ]          # 打上语义化版本 Tag 时触发 (如 v1.0.0)
    # 仅当涉及核心代码及构建文件变动时才触发镜像构建
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'main.py'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read
  packages: write  # 必须开启写入权限，以便推送镜像到 GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Docker Buildx 环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 GHCR (GitHub Container Registry)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 尝试登录到 Docker Hub（允许失败，不中断工作流）
      - name: Log in to Docker Hub
        id: login-dockerhub
        continue-on-error: true
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 解析并自动生成 Docker 标签（修复：通过 env 映射解决 secrets 作用域问题）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/penshot
            ${{ steps.login-dockerhub.outcome == 'success' && env.DOCKERHUB_USER != '' && format('{0}/penshot', env.DOCKERHUB_USER) || '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 6. 执行镜像构建并推送到仓库
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha         # 利用 GitHub Actions 缓存加速构建
          cache-to: type=gha,mode=max