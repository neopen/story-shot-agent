name: Security Scan  # 工作流名称：自动化安全诊断与扫描

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: '0 0 * * 1'  # 定时任务：每周一 00:00 UTC 自动执行一次全局扫描

permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 1：使用 GitHub 官方 CodeQL 静态分析 Python 代码的安全风险
  # ============================================================================
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write  # 用于向 GitHub "Security" 面板报告发现的安全缺陷

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 初始化 CodeQL 引擎
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      # 3. 执行安全代码分析
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ============================================================================
  # Job 2：在 PR 提交时审查第三方新增/升级依赖是否存在高危漏洞
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    # Dependency Review 只适用于 Pull Request
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 检查 PR 引入的依赖变更
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # 如果引入 high 或 critical 级别漏洞，则阻断 PR
          fail-on-severity: high