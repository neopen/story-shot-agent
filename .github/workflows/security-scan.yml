name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 每周一定时扫描（捕获新公布的已知漏洞）
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # 1. 扫描 Python 代码中的安全隐患（CodeQL）
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # 上报安全问题到 GitHub Security 标签页

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 2. PR 提交流程中审查第三方依赖漏洞
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 如果 PR 新增的依赖存在高危/致命漏洞，直接阻断合并
          fail-on-severity: high
