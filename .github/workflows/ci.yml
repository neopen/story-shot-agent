
name: CI Checks

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyyaml

          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[full,dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with flake8
        run: |
          flake8 . --config=.github/.flake8 --count \
            --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Style with flake8
        run: |
          flake8 . --config=.github/.flake8 \
            --count --exit-zero \
            --max-complexity=10 --statistics

      # 有测试用例后启用
