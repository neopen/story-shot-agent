name: CI Checks  # 工作流名称：持续集成检查

# 触发条件配置
on:
  push:
    branches: [ "main" ]  # 当代码推送到 main 分支时触发
    # 过滤路径：当修改仅发生在以下文件或目录时，跳过当前工作流以节省计算资源
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - '.qoder/**'
      - '.agents/**'
      - '.codex/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'

  pull_request:
    branches: [ "main" ]  # 当提交针对 main 分支的拉取请求（PR）时触发
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - '.qoder/**'
      - '.agents/**'
      - '.codex/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'

# 权限设置：仅需要读取仓库内容的权限
permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 运行环境

    steps:
      # 第一步：检出仓库代码到运行器中
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：配置指定版本的 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'  # 开启 pip 缓存，加速后续依赖安装速度

      # 第三步：安装项目所需的依赖包及代码质量检查工具
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyyaml
          
          # 根据项目配置文件优先安装本地包及其可选依赖
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[full,dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 第四步：使用 Flake8 进行严苛的语法与错误检查（遇到致命错误直接中断 CI）
      - name: Lint with flake8
        run: |
          # --config 指向 .github 目录下的配置文件，仅检查 Syntax Error 及严重变量问题
          flake8 . --config=.github/.flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      # 第五步：检查代码样式规范（非阻塞式，仅用于输出警告提示）
      - name: Style with flake8
        run: |
          flake8 . --config=.github/.flake8 --count --exit-zero --max-complexity=10 --statistics

      # 5. 执行单元测试 (Test)
      # - name: Run tests with pytest
      #   run: |
      #     pytest
