name: Upload Python Package

on:
  release:
    types: [published, prereleased]  # 仅在正式发布或预发布 Release 时触发

permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install build tools & twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source and wheel distributions
        run: |
          python -m build

      - name: Check package metadata with twine
        run: |
          # 检查打包出的 whl 和 tar.gz 元数据格式（如 README 渲染是否正常）
          twine check dist/*

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 7  # 构建产物保存 7 天

  pypi-publish:
    name: Publish package to PyPI
    needs:
      - release-build
    runs-on: ubuntu-latest
    
    # 🎯 现代化发布的关键配置：使用 OIDC 凭证（Trusted Publishing）
    permissions:
      id-token: write  # PyPI 认证必填权限

    environment:
      name: pypi
      url: https://pypi.org/p/penshot  # 可根据需要填入项目的 PyPI 页面地址

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 如果推送失败可以打印更详细的调试日志（默认 false）
          verbose: false
