# =============================================================================
# 剧本分镜智能体 - 剧本解析配置
# 用途：配置剧本解析所需的正则表达式模式、关键词映射和分类规则
# 版本：1.0
# 最后更新：2025-10-25
# =============================================================================

version: "1.0"
description: "剧本解析相关的配置，包括解析规则、默认参数等"


################### 场景识别规则配置 ###################
scene_recognition:
  # 场景开头标志（按顺序匹配，可用命名组：num/location/time/inout/dur）
  start_patterns:
    # 标准分场标题：INT. 咖啡馆 - 白天 / EXT. 街道 - 夜晚
    - '^(?P<prefix>INT|EXT|INT\./EXT|I/E)\s*[.．:：]?\s*(?P<location>.+?)(?:\s*[-–—]\s*(?P<time>[^\-–—]+))?$'
    # 中文编号分场：1. 教室 内 日（内/外 是必要的结构标志，用于排除 "1. 李明…" 这类列表项）
    - '^(?P<num>\d{1,3})\s*[.、．]\s*(?P<location>.+?)\s+(?P<inout>内景|外景|内|外)\s*(?P<time>日间|夜间|日|夜|晨|昏)?$'
    # 带序号的场次：【场景1】咖啡厅 - 白天 / 场景1：咖啡厅（数字或中文数字是必要标志，排除 "场景：高中教室"）
    - '^【?场景\s*(?P<num>\d+|[一二三四五六七八九十百]+)\s*[】\]]?\s*[:：、.．]?\s*(?P<location>.+?)(?:\s*[-–—]\s*(?P<time>.+?))?$'
    # 中文场次：第一场 教室 白天
    - '^第\s*(?P<num>\d+|[一二三四五六七八九十百]+)\s*[场幕回]\s*[:：、]?\s*(?P<location>.*)$'
    # AI 分镜镜头：镜头1（3秒），必须整行匹配，避免吞掉 "镜头7（便利贴特写）：…" 这类条目
    - '^镜头\s*(?P<num>\d{1,3})\s*(?:[（(](?P<dur>\d+(?:\.\d+)?)\s*秒?[)）])?$'
    # 带时间码的段落标题：【开场段落：孤独的痕迹】00:00-00:15
    - '^【[^】]{1,40}】\s*\d{1,2}:\d{2}\s*[-–~]\s*\d{1,2}:\d{2}$'
  # 场景切换标志
  transition_patterns:
    - "转场"
    - "切至"
    - "画面转到"
    - "画面切换到"
  # 场景结束标志
  end_patterns:
    - "【完】"
    - "（完）"

  # 场景元素识别规则
  scene_elements:
    # 环境描述关键词
    environment_keywords:
      - "天气"
      - "光线"
      - "温度"
      - "气味"
      - "声音"
    # 道具识别模式
    prop_patterns:
      - "(手机|电脑|书籍|文件|杯子|钥匙)[\\s\\S]*?"
      - "[\\s\\S]*?着(手机|电脑|书籍|文件|杯子|钥匙)"

  # 场景特殊处理规则
  scene_special_rules:
  # 电话对话处理 - 精确匹配测试剧本中的对话模式


################### 地点词表 ###################
