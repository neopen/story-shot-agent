  办公室: "办公室"
  会议室: "会议室"
  咖啡厅: "咖啡厅"
  咖啡馆: "咖啡馆"
  餐厅: "餐厅"
  大厅: "大厅"
  楼梯: "楼梯"
  天台: "天台"
  门口: "门口"
  窗前: "窗边"
  窗边: "窗边"
  座位: "座位"
  讲台: "讲台"
  黑板: "黑板"
