<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: #0a0c11;
    color: #f2f4f8;
    position: relative;
  }
  .glow {
    position: absolute; right: -120px; top: -180px; width: 760px; height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,176,32,.22), rgba(255,176,32,0) 62%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 85% 90% at 80% 10%, #000, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 85% 90% at 80% 10%, #000, transparent 75%);
  }
  .strip {
    position: absolute; right: 0; top: 0; bottom: 0; width: 118px;
    background: #07080b; border-left: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; justify-content: space-around; padding: 26px 0;
  }
  .strip i {
    display: block; width: 16px; height: 16px; margin: 0 auto; border-radius: 4px;
    border: 2px solid rgba(255,176,32,.55);
  }
  .inner { position: relative; padding: 62px 80px 56px; width: 1082px; height: 630px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .mark {
    width: 46px; height: 46px; border-radius: 12px; background: #12151d;
    border: 1px solid rgba(255,176,32,.4); display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
  .brand-name small { display: block; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #8b93a3; margin-top: 1px; }
  .eyebrow { margin-top: 54px; font-family: Consolas, monospace; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #ffb020; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: currentColor; opacity: .7; }
  h1 { margin-top: 18px; font-size: 62px; line-height: 1.14; letter-spacing: -.045em; font-weight: 700; }
  h1 em { font-style: normal; color: #ffb020; }
  .sub { margin-top: 22px; font-size: 19px; line-height: 1.7; color: #a9b1c0; }
  .flow { margin-top: 26px; display: flex; align-items: center; gap: 9px; font-family: Consolas, monospace; font-size: 13px; color: #7c8596; }
  .flow b { font-weight: 500; color: #d5dae3; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 6px; padding: 5px 9px; }
  .flow span { color: #ffb020; opacity: .65; }
  .footer { position: absolute; left: 80px; right: 80px; bottom: 42px; height: 46px; border-top: 1px solid rgba(255,255,255,.1); padding-top: 15px; font-family: Consolas, monospace; font-size: 12.5px; color: #98a1b1; white-space: nowrap; }
  .badges { display: inline; }
  .badges span { display: inline-block; margin-right: 8px; padding: 5px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; }
  .url { float: right; padding-top: 5px; font-size: 14px; color: #ffb020; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="inner">
    <div class="brand">
      <div class="mark">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <rect x="6" y="4" width="20" height="24" rx="3" stroke="#ffb020" stroke-width="2.2"/>
          <path d="M14 12.5v7l6-3.5-6-3.5Z" fill="#ffb020"/>
          <circle cx="10.5" cy="8.5" r="1.3" fill="#ffb020"/>
          <circle cx="21.5" cy="23.5" r="1.3" fill="#ffb020"/>
        </svg>
      </div>
      <div class="brand-name">PenShot<small>Storyboard Agent</small></div>
    </div>
    <div class="eyebrow">Open source · LangGraph multi-agent</div>
    <h1>把剧本，拆成<br><em>连贯的 AI 视频片段</em></h1>
    <p class="sub">把任意长度的剧本拆成 5 秒级分镜，输出中英双语视频提示词，<br>保证角色、场景与动作跨片段连贯。</p>
    <div class="flow">
      <b>解析</b><span>→</span><b>分镜</b><span>→</span><b>切割</b><span>→</span><b>提示词</b><span>→</span><b>审查</b><span>→</span><b>连续性</b>
    </div>
    <div class="footer">
      <div class="badges">
        <span>MIT License</span><span>Python 3.10+</span><span>pip install penshot</span><span>Sora · Veo · Runway · 可灵</span>
      </div>
      <div class="url">shot.helpenx.com</div>
    </div>
  </div>
</body>
</html>
